<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  fill="none"
>
  <defs>
    <linearGradient id="gold" x1="150" y1="100" x2="360" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF4B8"/>
      <stop offset="22%" stop-color="#F4D56F"/>
      <stop offset="58%" stop-color="#C9912D"/>
      <stop offset="100%" stop-color="#F8DF89"/>
    </linearGradient>

    <linearGradient id="silver" x1="100" y1="80" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="34%" stop-color="#E8E9EB"/>
      <stop offset="68%" stop-color="#9FA2A7"/>
      <stop offset="100%" stop-color="#F7F7F8"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Platinum circular frame -->
  <path
    d="M389 377
       C353 412 307 432 256 432
       C159 432 80 353 80 256
       C80 159 159 80 256 80
       C344 80 417 145 430 230"
    stroke="url(#silver)"
    stroke-width="16"
    stroke-linecap="round"
  />

  <!-- Gold lower-right arc -->
  <path
    d="M430 274
       C422 321 400 359 366 389"
    stroke="url(#gold)"
    stroke-width="18"
    stroke-linecap="round"
    filter="url(#softGlow)"
  />

  <!-- Gold T symbol -->
  <path
    d="M150 166
       H362
       L329 204
       H286
       V363
       L256 402
       L226 363
       V204
       H183
       Z"
    fill="url(#gold)"
    filter="url(#softGlow)"
  />

  <!-- Star -->
  <path
    d="M256 84
       L267 112
       L296 123
       L267 134
       L256 162
       L245 134
       L216 123
       L245 112
       Z"
    fill="url(#gold)"
    filter="url(#softGlow)"
  />

  <!-- Center highlight -->
  <circle
    cx="256"
    cy="256"
    r="8"
    fill="#FFFFFF"
    opacity="0.95"
  />
</svg>